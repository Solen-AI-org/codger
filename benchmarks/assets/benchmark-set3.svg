<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="860" height="220" fill="#ffffff"/>
  <text x="0" y="20" font-size="14" fill="#111111" font-weight="bold">LOC change vs baseline — Set 3 (agentic, real Claude Code sessions, Haiku, n=1, 12 tasks)</text>

  <!-- zero line -->
  <line x1="430" y1="35" x2="430" y2="185" stroke="#cccccc" stroke-width="1"/>
  <text x="430" y="200" font-size="11" fill="#888888" text-anchor="middle">baseline (0%)</text>

  <!-- caveman: +1% -->
  <text x="0" y="60" font-size="13" fill="#555555">caveman</text>
  <rect x="430" y="46" width="20" height="24" fill="#999999"/>
  <text x="456" y="63" font-size="13" fill="#111111">+1%</text>

  <!-- ponytail: -5% -->
  <text x="0" y="105" font-size="13" fill="#555555">ponytail</text>
  <rect x="330" y="91" width="100" height="24" fill="#999999"/>
  <text x="316" y="108" font-size="13" fill="#111111" text-anchor="end">-5%</text>

  <!-- codger: -10% -->
  <text x="0" y="150" font-size="13" fill="#111111" font-weight="bold">codger</text>
  <rect x="230" y="136" width="200" height="24" fill="#111111"/>
  <text x="216" y="153" font-size="13" fill="#111111" font-weight="bold" text-anchor="end">-10%</text>

  <text x="0" y="216" font-size="11" fill="#888888">Left of the line = fewer LOC than baseline (better). Only benchmark run as real Claude Code sessions, not single-shot. n=1 — see benchmarks/README.md.</text>
</svg>
