# Codger benchmark, set 1 — parity with ponytail's own numbers.
# Same 5 everyday tasks, same metrics (loc.js/correctness.js vendored MIT from
# DietrichGebert/ponytail, unchanged), one more profile added: codger.
#
#   Run:   npx promptfoo@latest eval -c benchmarks/promptfooconfig.yaml --env-file ../.env --repeat 10
#   View:  npx promptfoo@latest view
#
# Needs ANTHROPIC_API_KEY (see benchmarks/README.md). ponytail-SKILL.md and
# caveman-SKILL.md are vendored (MIT) at profiles/ — see profiles/*.js for the loading shape,
# copied verbatim from ponytail's own benchmark harness.
description: "Codger vs ponytail vs caveman vs no-skill: same model, same tasks. Measures code LOC (deterministic) and correctness (executed/structural checks)."

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config: { max_tokens: 8192, temperature: 1 }
  - id: anthropic:messages:claude-sonnet-4-6
    config: { max_tokens: 8192, temperature: 1 }
  - id: anthropic:messages:claude-opus-4-8
    config: { max_tokens: 8192, temperature: 1 }

prompts:
  - id: file://profiles/baseline.js
    label: baseline (no skill)
  - id: file://profiles/caveman.js
    label: caveman
  - id: file://profiles/ponytail.js
    label: ponytail
  - id: file://profiles/codger.js
    label: codger

defaultTest:
  assert:
    - type: javascript
      value: file://loc.js
      metric: code_loc
    - type: javascript
      value: file://correctness.js
      metric: correct

tests:
  - vars: { task: "Write me a Python function that validates email addresses." }
  - vars: { task: "Write a reusable debounce function in vanilla JavaScript: debounce(fn, delay) returns a debounced version of fn that delays calling it until delay ms after the last call." }
  - vars: { task: "Write Python code that reads sales.csv and sums the 'amount' column." }
  - vars: { task: "Build me a countdown timer component in React that counts down from a given number of seconds." }
  - vars: { task: "Add rate limiting to my FastAPI endpoint so users can't spam it." }
